
<html>
<head>
<title>Sneaker Store</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

<style>
body {
    background: linear-gradient(to right, #74ebd5, #ACB6E5);
}
.card {
    border-radius: 15px;
}
.main-img {
    width: 100%;
    border-radius: 10px;
    transition: transform 0.3s;
}
.main-img:hover {
    transform: scale(1.1);
}
.thumb-img {
    width: 70px;
    margin: 5px;
    cursor: pointer;
    border-radius: 8px;
    border: 2px solid transparent;
}
.thumb-img:hover {
    border: 2px solid black;
}
.btn-cart {
    background: #ff4d4d;
    color: white;
}
.btn-cart:hover {
    background: #e60000;
}
#msg {
    display: none;
    color: green;
    font-weight: bold;
}
</style>

<script>
function changeImage(src) {
    document.getElementById("mainImage").src = src;
}

function selectColor(color) {
    if(color === 'red') {
        document.getElementById("mainImage").src = "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519";
    }
    if(color === 'blue') {
        document.getElementById("mainImage").src = "https://images.unsplash.com/photo-1542291026-7eec264c27ff";
    }
    if(color === 'black') {
        document.getElementById("mainImage").src = "https://images.unsplash.com/photo-1528701800489-20be3c2ea3c3";
    }
}

function addToCart() {
    document.getElementById("msg").style.display = "block";
}
</script>

</head>

<body>

<div class="container mt-5">
<div class="card p-4 shadow">

<div class="row">

<div class="col-md-6 text-center">

<img id="mainImage" class="main-img" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff">

<div class="mt-3">
<img class="thumb-img" src="https://images.unsplash.com/photo-1542291026-7eec264c27ff" onclick="changeImage(this.src)">
<img class="thumb-img" src="wd3.jpg" onclick="changeImage(this.src)" width="60"height = "60">
<img class="thumb-img" src="wd2.jpg" onclick="changeImage(this.src)"width="60"height = "60">
<img class="thumb-img" src="wd1.jpg" onclick="changeImage(this.src)"width="60"height = "60">
<img class="thumb-img" src="wd4.jpg" onclick="changeImage(this.src)"width="60"height = "60">


</div>

</div>

<div class="col-md-6">

<h2>Stylish Sneakers</h2>
<p><strong>Price:</strong> ₹2999</p>

<div class="mb-3">
<p><strong>Color:</strong></p>
<input type="radio" name="color" onclick="selectColor('red')"> Pink
<input type="radio" name="color" onclick="selectColor('blue')"> Blue
<input type="radio" name="color" onclick="selectColor('black')"> Red
<input type="radio" name="color" onclick="selectColor('black')"> Beige
<input type="radio" name="color" onclick="selectColor('black')"> Offwhite


</div>

<div class="mb-3">
<p><strong>Size:</strong></p>
<input type="radio" name="size"> 6
<input type="radio" name="size"> 7
<input type="radio" name="size"> 8
<input type="radio" name="size"> 9
</div>

<div class="mb-3">
<label><strong>Quantity:</strong></label>
<input type="number" value="1" min="1" class="form-control w-25">
</div>

<button class="btn btn-cart" onclick="addToCart()">Add to Cart</button>

<p id="msg">✔ Added to Cart!</p>

<div class="mt-4">
<h5>Customer Reviews</h5>
<p>⭐⭐⭐⭐☆ Good quality</p>
<p>⭐⭐⭐⭐⭐ Very comfortable</p>
</div>

</div>

</div>
</div>
</div>

</body>
</html>
